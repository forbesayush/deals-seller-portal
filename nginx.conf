user nginx;
worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip Compression Tuning for Traffic Spikes
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate Limiting Zone — 30 requests per second per IP with burst allowance of 50
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream backend pool with keepalive connection reuse
    upstream backend_nodes {
        server backend:5000;
        keepalive 64;
    }

    # Upstream frontend pool
    upstream frontend_nodes {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirect API routes to the FastAPI Backend with rate limiting & keepalive
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_nodes/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache static Next.js assets
        location /_next/static/ {
            proxy_pass http://frontend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Redirect HTML and asset routes to Next.js Frontend
        location / {
            proxy_pass http://frontend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

